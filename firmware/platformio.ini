; Localify breadboard player. Build and upload with PlatformIO:
;   pio run -t upload        then   pio device monitor
; Or open localify_player/localify_player.ino in the Arduino IDE instead.
; Guide: ../docs/BREADBOARD.md

[platformio]
src_dir = localify_player

[env:esp32dev]
platform = espressif32@^6.9.0      ; Arduino core 2.x (ESP8266Audio 1.9.x needs it)
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  earlephilhower/ESP8266Audio@^1.9.7
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
