# Publishes Localify to GitHub Pages on every push to main (or by hand from the Actions tab).
# Nothing happens until Pages is enabled with Source = "GitHub Actions" (see docs/DEPLOY.md).
#
# Only an explicit list of app files is published — never songs, shortcuts, tools or
# anything else that happens to be in the repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the site folder (allowlist)
        run: |
          set -euo pipefail
          mkdir -p _site/icons
          cp localify_offline_mp3_player.html index.html manifest.webmanifest sw.js _site/
          cp icons/icon.svg icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png icons/apple-touch-icon.png _site/icons/
          # A new service-worker version per deploy makes installed apps offer "Reload".
          sed -i "s/^const VERSION = 'dev';/const VERSION = '${GITHUB_SHA::12}';/" _site/sw.js
          grep -q "const VERSION = '${GITHUB_SHA::12}';" _site/sw.js
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
